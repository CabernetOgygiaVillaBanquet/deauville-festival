[project]
name = "deauville-festival"
version = "0.1.0"
description = "Deauville Festival du Rire backend"
readme = "README.md"
authors = [
    { name = "Nicolas Cholin", email = "146072081+CabernetOgygiaVillaBanquet@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]